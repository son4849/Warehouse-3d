<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kho NVL 3D</title>
<style>
:root{--bg:#0a0f1a;--pn:#111827;--ln:#1f2a3d;--ac:#38bdf8;--hot:#f59e0b;--mu:#7b8aa3}
*{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',Tahoma,sans-serif}
body{background:var(--bg);color:#e8eef7;display:flex;height:100vh;overflow:hidden}
input,select,textarea{width:100%;padding:9px 11px;background:var(--bg);border:1px solid var(--ln);border-radius:8px;color:#fff;font-size:.9rem;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--ac)}
textarea{height:110px;resize:vertical;font-size:.82rem;margin:8px 0}
button{padding:8px 12px;background:var(--bg);border:1px solid var(--ln);color:#b6c3d9;border-radius:8px;cursor:pointer;font-weight:600;font-size:.85rem}
button:hover{color:#fff;border-color:var(--ac)}
button.on,button.pri{background:var(--ac);color:#0b1220;border-color:var(--ac)}
small{color:var(--mu)}
.side{width:330px;flex-shrink:0;background:var(--pn);border-right:1px solid var(--ln);display:flex;flex-direction:column;min-height:0}
.sbox{padding:14px 14px 8px}
#q{font-size:1rem;padding:12px 14px}
.list{flex:1;overflow-y:auto;padding:4px 14px 10px;display:flex;flex-direction:column;gap:6px}
.row{padding:10px 12px;border-radius:8px;background:#0e1626;border:1px solid transparent;cursor:pointer}
.row:hover{border-color:var(--ac)}
.rt{display:flex;justify-content:space-between;align-items:center}.rt b{color:#fff}
.chip{font-size:.7rem;background:#7c2d12;color:#fed7aa;padding:1px 7px;border-radius:10px}
.nm{font-size:.8rem;color:var(--mu);margin-top:1px}
.loc{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.loc span{font-size:.75rem;color:var(--hot);background:#1b1408;border:1px solid #3b2a0b;padding:2px 7px;border-radius:5px}
.loc span:hover{background:var(--hot);color:#000}
.empty{color:var(--mu);font-size:.85rem;padding:10px 2px}
.panel{border-top:1px solid var(--ln);padding:12px 14px;display:flex;flex-direction:column;gap:8px;background:#0d1422}
.sel{display:flex;gap:8px}.sel div{flex:1}.sel label{font-size:.68rem;color:var(--mu)}
.it{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:.88rem;padding:5px 0;border-bottom:1px solid var(--ln)}
.it button{padding:1px 8px}
.seg{display:flex;gap:6px}.seg input{display:none}
.seg label{flex:1;text-align:center;border:1px solid var(--ln);border-radius:6px;padding:6px 0;font-size:.78rem;cursor:pointer;color:var(--mu)}
.seg label:has(input:checked){background:var(--ac);color:#0b1220;border-color:var(--ac);font-weight:700}
.r2{display:flex;gap:8px}.r2>*{flex:1}
#msg{font-size:.78rem;color:var(--hot);min-height:1em}
.main{flex:1;display:flex;flex-direction:column;min-width:0}
.head{padding:10px 16px;background:var(--pn);border-bottom:1px solid var(--ln);display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;position:relative;z-index:10}
.head b{margin-right:10px}.head .hb{display:flex;gap:8px;align-items:center}
.menu{position:relative}
.menu summary{list-style:none;cursor:pointer;padding:8px 12px;border:1px solid var(--ln);border-radius:8px;color:#b6c3d9;font-weight:600;font-size:.85rem}
.mpop{position:absolute;right:0;top:115%;width:230px;background:var(--pn);border:1px solid var(--ln);border-radius:10px;padding:8px;display:flex;flex-direction:column;gap:2px;z-index:20;box-shadow:0 10px 30px #000a}
.mpop button{text-align:left;border:0;background:none}.mpop button:hover{background:#1a2740}
.mpop h4{font-size:.68rem;color:var(--mu);padding:8px 8px 2px;font-weight:600;text-transform:uppercase}
#view{flex:1;position:relative;min-height:0}
#view canvas{display:block;width:100%;height:100%}
.hint{position:absolute;left:12px;bottom:10px;font-size:.76rem;color:var(--mu);background:rgba(10,15,26,.8);padding:5px 10px;border-radius:6px;pointer-events:none}
#tip{position:absolute;display:none;pointer-events:none;background:#0a0f1af2;border:1px solid var(--ac);border-radius:8px;padding:6px 10px;font-size:.8rem}
#moveBar{display:none;position:absolute;top:10px;left:50%;transform:translateX(-50%);background:var(--hot);color:#000;padding:6px 8px 6px 14px;border-radius:20px;font-size:.82rem;font-weight:600;align-items:center;gap:10px}
#moveBar button{padding:3px 12px;background:#000;color:#fff;border:0;border-radius:14px}
dialog{background:var(--pn);color:#fff;border:1px solid var(--ln);border-radius:12px;padding:18px;width:min(440px,92vw)}
dialog::backdrop{background:#000a}
@media(max-width:800px){body{flex-direction:column}.side{width:100%;max-height:55vh}}
</style>
</head>
<body>
<div class="side">
  <div class="sbox"><input id="q" placeholder="Tìm mã NVL…  (nhấn / để tìm nhanh)" oninput="doSearch()" onkeydown="if(event.key==='Enter')goFirst()"></div>
  <div class="list" id="list"></div>
  <div class="panel">
    <div class="sel">
      <div><label>Giá</label><select id="fRack" onchange="rackChanged()"></select></div>
      <div><label>Khoang</label><select id="fBay" onchange="formSel()"></select></div>
      <div><label>Tầng</label><select id="fTier" onchange="formSel()"></select></div>
    </div>
    <div id="slotCard"></div>
    <div class="seg">
      <label><input type="radio" name="pos" value="F" checked>Cả hàng</label>
      <label><input type="radio" name="pos" value="L">Trái</label>
      <label><input type="radio" name="pos" value="M">Giữa</label>
      <label><input type="radio" name="pos" value="R">Phải</label>
    </div>
    <div class="r2">
      <input id="fCode" placeholder="Mã NVL" onkeydown="if(event.key==='Enter')assign()">
      <input id="fName" placeholder="Tên (không bắt buộc)" onkeydown="if(event.key==='Enter')assign()">
    </div>
    <button class="pri" onclick="assign()">Gán vào ô này</button>
    <div id="msg"></div>
  </div>
</div>
<div class="main">
  <div class="head">
    <div><b>📦 Kho NVL</b><small id="stats"></small></div>
    <div class="hb">
      <button onclick="suggest()">✨ Gợi ý ô trống</button>
      <button id="bEmp" onclick="toggleEmpty()">Xem ô trống</button>
      <button onclick="goHome()">Toàn cảnh</button>
      <details id="menu" class="menu"><summary>⚙ Công cụ</summary>
        <div class="mpop" onclick="this.closest('details').open=false">
          <h4>Bố cục kho</h4>
          <button id="bMove" onclick="toggleMove()">Di chuyển giá / xe đẩy</button>
          <button onclick="rotGroup()">Xoay cụm đang chọn</button>
          <button onclick="addBlock()">+ Thêm cụm giá</button>
          <button onclick="addTrolley()">+ Thêm xe đẩy</button>
          <button onclick="editGroup()">Sửa số khoang / tầng</button>
          <button onclick="delGroup()">Xóa cụm đang chọn</button>
          <h4>Hiển thị</h4>
          <button id="bLab" onclick="toggleLabels()">Hiện tên giá</button>
          <button id="bSpin" onclick="toggleSpin()">Tự xoay</button>
          <h4>Dữ liệu</h4>
          <button onclick="document.getElementById('dlgBulk').showModal()">Nhập hàng loạt (dán từ Excel)</button>
          <button onclick="exportCsv()">Xuất Excel (.csv)</button>
          <button onclick="exportJson()">Tải data.json</button>
          <button onclick="document.getElementById('file').click()">Mở file JSON</button>
          <button onclick="clearAll()">Xóa toàn bộ dữ liệu</button>
        </div>
      </details>
    </div>
  </div>
  <div id="view">
    <div class="hint">Kéo: xoay · Cuộn: zoom · Bấm ô kệ để chọn · Rê chuột để xem mã</div>
    <div id="tip"></div>
    <div id="moveBar">Kéo giá / xe đẩy tới vị trí mới <button onclick="toggleMove()">Xong</button></div>
  </div>
</div>
<input type="file" id="file" accept=".json" hidden onchange="importFile(this)">
<dialog id="dlgBulk">
  <h3>Nhập hàng loạt</h3>
  <small>Dán từ Excel, mỗi dòng: Mã, Giá, Khoang, Tầng, Vị trí (F/L/M/R), Tên</small>
  <textarea id="bulk" placeholder="PCB-01, A1, 2, 3, F, Bo mạch&#10;IC-5V, B2, 1, 1, L, IC nguồn"></textarea>
  <div class="r2"><button class="pri" onclick="bulkImport();document.getElementById('dlgBulk').close()">Nhập</button><button onclick="document.getElementById('dlgBulk').close()">Đóng</button></div>
</dialog>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
/* ===== CẤU HÌNH KỆ (toạ độ lấy từ sơ đồ, đơn vị pixel) ===== */
const S = 0.025, OX = 1111, OY = 514, TH = 0.5, TIERS = 6;
const X = p => (p - OX) * S, Z = p => (p - OY) * S;
const RACKS = [], R = {};
function block(letter, xs, y0, y1, bays) {
  for (let i = 0; i < xs.length - 1; i++) {
    const r = { id: letter + (i + 1), bays, tiers: TIERS, w: (xs[i + 1] - xs[i]) * S, L: (y1 - y0) * S, cx: X((xs[i] + xs[i + 1]) / 2), cz: Z((y0 + y1) / 2),
      face: xs.length === 2 ? -1 : (i === 0 ? -1 : 1), pair: xs.length > 2, grp: letter };
    RACKS.push(r); R[r.id] = r;
  }
}
// Xe đẩy: 1 khoang, 4 tầng, kéo di chuyển được
function mkTrolley(id, x, z, ry) {
  const r = { id, grp: id, bays: 1, tiers: 3, w: 0.6, L: 1.6, cx: x, cz: z, ry: ry || 0, face: -1, pair: false, tr: true };
  RACKS.push(r); R[id] = r; return r;
}
// Khu trong: 3 khoang
block("A", [695, 723, 751], 103, 343, 3);
block("B", [811, 839, 867], 103, 343, 3);
block("C", [929, 960, 991], 103, 343, 3);
block("D", [1051, 1083], 103, 343, 3);
block("E", [1113, 1142], 103, 231, 1);
// Khu ngoài: 2 khoang
block("F", [929, 960, 991], 487, 711, 2);
block("G", [1051, 1083, 1113], 487, 711, 2);
block("H", [1185, 1213, 1243], 487, 711, 2);
block("I", [1302, 1331, 1359], 487, 711, 2);
block("J", [1420, 1448, 1476], 487, 711, 2);
block("K", [1537, 1565, 1593], 487, 711, 2);
block("L", [1250, 1278, 1306], 727, 951, 2); // cụm thêm: kéo tới đúng chỗ
block("M", [1400, 1428, 1456], 727, 951, 2);
const SAMPLE = [
  { code: "PCB-MAIN-A1", name: "Bo mạch chính A1", rack: "A1", bay: 2, tier: 3, pos: "F" },
  { code: "FPCB-FL-02", name: "Cáp dẻo màn hình", rack: "A1", bay: 1, tier: 1, pos: "L" },
  { code: "IC-PWR-5V", name: "IC Nguồn 5V", rack: "A1", bay: 1, tier: 1, pos: "R" },
  { code: "CONN-TYPE-C", name: "Cổng sạc Type-C", rack: "G2", bay: 2, tier: 2, pos: "F" }
];
/* ================================================================ */

const KEY = "kho3d.items.v1", POSN = { F: "Cả hàng", L: "Đầu trái", M: "Ở giữa", R: "Đầu phải" };
let items = [], hl = new Set(), sel = null, outline = null, fly = null;
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const $ = id => document.getElementById(id);
const uid = () => Math.random().toString(36).slice(2, 10);
const key = (r, b, t) => r + "|" + b + "|" + t;

const view = $("view");
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x070d18);
const camera = new THREE.PerspectiveCamera(50, 1, 0.1, 300);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
view.appendChild(renderer.domElement);
const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.maxPolarAngle = Math.PI / 2.05; controls.minDistance = 3; controls.maxDistance = 70;
scene.add(new THREE.AmbientLight(0xffffff, 0.75));
const sun = new THREE.DirectionalLight(0xffffff, 0.8); sun.position.set(10, 25, 15); scene.add(sun);
const HOME = { pos: new THREE.Vector3(0, 30, 24), tgt: new THREE.Vector3(0, 0, 0) };
camera.position.copy(HOME.pos);

const stat = new THREE.Group(), dyn = new THREE.Group(); scene.add(stat, dyn);
const hits = [], hitMap = {};
const hotMat = new THREE.MeshStandardMaterial({ color: 0xf59e0b, emissive: 0xb45309 });
const matCache = {};
function matFor(code) {
  if (!matCache[code]) {
    let h = 0; for (const ch of code) h = (h * 31 + ch.charCodeAt(0)) % 360;
    matCache[code] = new THREE.MeshStandardMaterial({ color: new THREE.Color().setHSL(h / 360, 0.55, 0.6) });
  }
  return matCache[code];
}
function label(text, bg, fg, h) {
  const c = document.createElement("canvas"), g = c.getContext("2d");
  g.font = "bold 44px Segoe UI,Arial";
  const w = Math.ceil(g.measureText(text).width) + 36; c.width = w; c.height = 72;
  g.font = "bold 44px Segoe UI,Arial"; g.fillStyle = bg; g.fillRect(0, 0, w, 72);
  g.fillStyle = fg; g.textAlign = "center"; g.textBaseline = "middle"; g.fillText(text, w / 2, 38);
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(c), depthTest: false }));
  s.scale.set(h * w / 72, h, 1); s.renderOrder = 5; return s;
}
function box(w, h, d, color, x, y, z, op, parent) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), new THREE.MeshStandardMaterial({ color, transparent: op < 1, opacity: op }));
  m.position.set(x, y, z); (parent || stat).add(m); return m;
}
function wall(a, b, c, d) {
  const x1 = X(a), z1 = Z(b), x2 = X(c), z2 = Z(d);
  box(Math.abs(x2 - x1) || 0.15, 1.6, Math.abs(z2 - z1) || 0.15, 0x64748b, (x1 + x2) / 2, 0.8, (z1 + z2) / 2, 0.45);
}
function thing(x1, y1, x2, y2, h, color, text) {
  box((x2 - x1) * S, h, (y2 - y1) * S, color, X((x1 + x2) / 2), h / 2, Z((y1 + y2) / 2), 1);
  if (text) { const l = label(text, "rgba(30,41,59,.85)", "#e2e8f0", 0.5); l.position.set(X((x1 + x2) / 2), h + 0.5, Z((y1 + y2) / 2)); stat.add(l); }
}

function buildStatic() {
  const sh = new THREE.Shape();
  [[511, 61], [1142, 61], [1142, 487], [1712, 487], [1712, 967], [511, 967]].forEach((p, i) => i ? sh.lineTo(X(p[0]), -Z(p[1])) : sh.moveTo(X(p[0]), -Z(p[1])));
  const floor = new THREE.Mesh(new THREE.ShapeGeometry(sh), new THREE.MeshStandardMaterial({ color: 0x101c30 }));
  floor.rotation.x = -Math.PI / 2; stat.add(floor);
  // tường theo sơ đồ (chừa chỗ cho cửa)
  wall(511, 61, 1142, 61); wall(1142, 61, 1142, 487); wall(511, 61, 511, 967);
  wall(511, 487, 695, 487); wall(839, 487, 1712, 487);
  wall(1712, 487, 1712, 680); wall(1712, 790, 1712, 967);
  wall(511, 967, 695, 967); wall(839, 967, 1712, 967);
  [[767, 487], [767, 967], [1712, 735]].forEach(p => { const l = label("Cửa", "#0e7490", "#fff", 0.55); l.position.set(X(p[0]), 0.9, Z(p[1])); stat.add(l); });
  thing(695, 61, 1142, 103, 1.0, 0x334155);
  thing(511, 487, 572, 551, 2.2, 0x475569, "Điều hòa cây");
  thing(572, 487, 695, 535, 1.2, 0x475569, "Máy hút ẩm");
  [1, 2, 3].forEach(i => thing(511, 551 + (i - 1) * 96, 572, 551 + i * 96, 0.9, 0x1e40af, "PC " + i));

}
const ledMat = new THREE.MeshBasicMaterial({ color: 0x5eead4 });
function buildRack(r) {
  const g = r.g = new THREE.Group(); g.position.set(r.cx, r.tr ? 0.12 : 0, r.cz); g.rotation.y = r.ry || 0; scene.add(g);
  r.content = new THREE.Group(); g.add(r.content);
  const w = r.w, len = r.L / r.bays, H = r.tiers * TH + 0.1, f = r.face;
  for (let k = 0; k <= r.bays; k++) [-1, 1].forEach(sd => box(0.08, H, 0.08, 0xcbd5e1, sd * (w / 2 - 0.05), H / 2, -r.L / 2 + k * len, 1, g));
  for (let t = 0; t <= r.tiers; t++) {
    box(w, 0.06, r.L, 0x94a3b8, 0, t * TH + 0.03, 0, r.tr ? 0.6 : 1, g);
    if (t < r.tiers && !r.tr) box(0.03, 0.04, r.L, 0x5eead4, f * (w / 2), t * TH + 0.1, 0, 1, g).material = ledMat;
  }
  if (r.tr) [-1, 1].forEach(a => [-1, 1].forEach(b2 => {
    const c = new THREE.Mesh(new THREE.SphereGeometry(0.06, 8, 8), new THREE.MeshStandardMaterial({ color: 0x111827 }));
    c.position.set(a * (w / 2 - 0.05), -0.06, b2 * (r.L / 2 - 0.1)); g.add(c);
  }));
  const l = label(r.id, r.tr ? "#f59e0b" : "#38bdf8", "#0b1220", 0.45);
  l.position.set(r.pair ? f * 0.45 : 0, H + 0.5, 0); l.visible = false; r.label = l; g.add(l);
  for (let b = 1; b <= r.bays; b++) for (let t = 1; t <= r.tiers; t++) {
    const m = new THREE.Mesh(new THREE.BoxGeometry(w - 0.06, TH - 0.06, len - 0.06), new THREE.MeshBasicMaterial({ color: 0x38bdf8, transparent: true, opacity: 0.07, depthWrite: false }));
    m.position.set(0, (t - 1) * TH + TH / 2 + 0.03, -r.L / 2 + (b - 0.5) * len);
    m.userData = { r: r.id, b, t }; g.add(m); hits.push(m); hitMap[key(r.id, b, t)] = m;
  }
}
const KEY2 = "kho3d.trolleys.v1";
function loadTrolleys() {
  let a = null; try { a = JSON.parse(localStorage.getItem(KEY2)); } catch (e) {}
  if (!Array.isArray(a) || !a.length) a = [{ id: "XD1", x: X(900), z: Z(830), ry: 0 }, { id: "XD2", x: X(1000), z: Z(830), ry: 0 }, { id: "XD3", x: X(1100), z: Z(830), ry: 0 }];
  a.forEach(t => mkTrolley(t.id, t.x, t.z, t.ry));
}
function layoutData() { return RACKS.map(r => ({ id: r.id, grp: r.grp, bays: r.bays, tiers: r.tiers, w: r.w, L: r.L, face: r.face, pair: r.pair, tr: !!r.tr, x: r.g.position.x, z: r.g.position.z, ry: r.g.rotation.y })); }
function saveLayout() { try { localStorage.setItem(KEY3, JSON.stringify(layoutData())); } catch (e) {} updateStats(); }
function dropRack(r) {
  if (r.g) scene.remove(r.g);
  for (let i = hits.length - 1; i >= 0; i--) if (hits[i].userData.r === r.id) hits.splice(i, 1);
  Object.keys(hitMap).forEach(k => { if (k.startsWith(r.id + "|")) delete hitMap[k]; });
}
function refreshOptions() { const cur = $("fRack").value; $("fRack").innerHTML = RACKS.map(r => `<option>${r.id}</option>`).join(""); if (R[cur]) $("fRack").value = cur; }
function setLayout(lay) {
  RACKS.forEach(dropRack);
  if (Array.isArray(lay) && lay.length) { RACKS.length = 0; Object.keys(R).forEach(k => delete R[k]); lay.forEach(d => { const r = { ...d, cx: d.x, cz: d.z }; RACKS.push(r); R[r.id] = r; }); }
  else if (!RACKS.some(r => r.tr)) loadTrolleys();
  RACKS.forEach(buildRack); refreshOptions();
  const c = sel && R[sel.r] ? sel : { r: RACKS[0].id, b: 1, t: 1 };
  selectSlot(c.r, Math.min(c.b, R[c.r].bays), Math.min(c.t, R[c.r].tiers), false);
}
const grpOf = r => RACKS.filter(x => x.grp === r.grp);
function rotGroup() {
  const r = sel && R[sel.r]; if (!r) return;
  const m = grpOf(r), c = new THREE.Vector3(); m.forEach(x => c.add(x.g.position)); c.divideScalar(m.length);
  m.forEach(x => { const dx = x.g.position.x - c.x, dz = x.g.position.z - c.z; x.g.position.x = c.x + dz; x.g.position.z = c.z - dx; x.g.rotation.y += Math.PI / 2; });
  saveLayout();
}
function addBlock() {
  const nb = parseInt(prompt("Số khoang mỗi giá (vd 2 hoặc 3)?", "2")); if (!(nb >= 1 && nb <= 6)) return;
  let ch = 65; while (RACKS.some(r => r.grp === String.fromCharCode(ch))) ch++;
  const L = String.fromCharCode(ch), bl = nb >= 3 ? 2.0 : 2.8;
  [-1, 1].forEach((f, i) => { const r = { id: L + (i + 1), grp: L, bays: nb, tiers: 6, w: 0.7, L: nb * bl, cx: i * 0.7 - 0.35, cz: 0, ry: 0, face: f, pair: true }; RACKS.push(r); R[r.id] = r; buildRack(r); });
  refreshOptions(); saveLayout(); selectSlot(L + "1", 1, 1, true);
}
function addTrolley() {
  let n = 1; while (R["XD" + n]) n++;
  const r = mkTrolley("XD" + n, 0, 7, 0); buildRack(r); refreshOptions(); saveLayout(); selectSlot(r.id, 1, 1, true);
}
function delGroup() {
  const r = sel && R[sel.r]; if (!r) return; const m = grpOf(r), ids = m.map(x => x.id);
  if (!confirm("Xóa " + ids.join(", ") + " và toàn bộ NVL đang gán trên đó?")) return;
  m.forEach(x => { dropRack(x); delete R[x.id]; RACKS.splice(RACKS.indexOf(x), 1); });
  items = items.filter(i => !ids.includes(i.rack)); save(); saveLayout(); refreshOptions();
  if (RACKS.length) selectSlot(RACKS[0].id, 1, 1, false); doSearch();
}
function editGroup() {
  const r = sel && R[sel.r]; if (!r) return;
  const v = prompt("Cụm " + r.grp + ': nhập "số khoang, số tầng"', r.bays + "," + r.tiers); if (!v) return;
  const [nb, nt] = v.split(/[,; ]+/).map(Number); if (!(nb >= 1 && nb <= 6 && nt >= 1 && nt <= 10)) return alert("Giá trị không hợp lệ.");
  const m = grpOf(r), ids = m.map(x => x.id), lost = items.filter(i => ids.includes(i.rack) && (i.bay > nb || i.tier > nt));
  if (lost.length && !confirm(lost.length + " NVL nằm ngoài khoang/tầng mới sẽ bị xóa. Tiếp tục?")) return;
  items = items.filter(i => !lost.includes(i));
  m.forEach(x => { const bl = x.L / x.bays; x.cx = x.g.position.x; x.cz = x.g.position.z; x.ry = x.g.rotation.y; dropRack(x); x.bays = nb; x.tiers = nt; x.L = nb * bl; buildRack(x); });
  save(); saveLayout(); selectSlot(r.id, 1, 1, false); doSearch();
}
const KEY3 = "kho3d.layout.v2", arrows = [];
function addArrow(r, x, y, z) {
  const top = r.tiers * TH + 1.2, g = new THREE.Group(), m = new THREE.MeshBasicMaterial({ color: 0xf59e0b, depthTest: false });
  const cone = new THREE.Mesh(new THREE.ConeGeometry(0.28, 0.6, 16), m); cone.rotation.x = Math.PI; cone.position.y = 0.3;
  const beam = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.03, top - y, 8), m); beam.position.y = -(top - y) / 2;
  cone.renderOrder = beam.renderOrder = 6; g.add(cone, beam); g.position.set(x, top, z); g.userData.base = top; r.content.add(g); arrows.push(g);
}
const reelGeo = new THREE.CylinderGeometry(TH / 2 - 0.06, TH / 2 - 0.06, 0.045, 20), dum = new THREE.Object3D();
let labelsOn = false, emptyOn = false;
const usedSet = () => new Set(items.map(i => key(i.rack, i.bay, i.tier)));
function updateLabels() {
  const act = new Set(); hl.forEach(id => { const i = items.find(x => x.id === id); if (i) act.add(i.rack); }); if (sel) act.add(sel.r);
  RACKS.forEach(r => { if (r.label) r.label.visible = labelsOn || act.has(r.id); });
}
function updateHits() {
  const used = usedSet();
  hits.forEach(m => { const u = m.userData, free = emptyOn && !used.has(key(u.r, u.b, u.t)); m.material.color.set(free ? 0x22c55e : 0x38bdf8); m.material.opacity = free ? 0.3 : 0.07; });
}
function updateStats() {
  const total = RACKS.reduce((a, r) => a + r.bays * r.tiers, 0), used = [...usedSet()].filter(k => R[k.split("|")[0]]).length;
  $("stats").textContent = `${used}/${total} ô có hàng · ${total ? Math.round(used * 100 / total) : 0}%`;
}
function toggleLabels() { labelsOn = !labelsOn; $("bLab").classList.toggle("on", labelsOn); updateLabels(); }
function toggleEmpty() { emptyOn = !emptyOn; $("bEmp").classList.toggle("on", emptyOn); updateHits(); }
function suggest() {
  const used = usedSet(), doors = [[767, 967], [1712, 735], [767, 487]].map(d => new THREE.Vector3(X(d[0]), 0, Z(d[1])));
  let best = null, bs = 1e9;
  hits.forEach(m => {
    const u = m.userData; if (R[u.r].tr || used.has(key(u.r, u.b, u.t))) return;
    const p = m.getWorldPosition(new THREE.Vector3()), d = Math.min(...doors.map(q => Math.hypot(p.x - q.x, p.z - q.z)));
    const sc = d + (u.t === 2 || u.t === 3 ? 0 : u.t === 1 || u.t === 4 ? 3 : 8);
    if (sc < bs) { bs = sc; best = u; }
  });
  if (!best) { $("msg").textContent = "Không còn ô trống trên giá cố định."; return; }
  selectSlot(best.r, best.b, best.t, true);
  $("msg").textContent = `Gợi ý: giá ${best.r} · khoang ${best.b} · tầng ${best.t} (gần cửa, tầm tay dễ lấy).`;
  $("fCode").focus();
}
function exportCsv() {
  const rows = [["Mã", "Tên", "Giá", "Khoang", "Tầng", "Vị trí"]].concat(items.slice().sort((a, b) => a.code.localeCompare(b.code)).map(i => [i.code, i.name, i.rack, i.bay, i.tier, POSN[i.pos]]));
  const csv = "\ufeff" + rows.map(r => r.map(v => '"' + String(v).replace(/"/g, '""') + '"').join(",")).join("\r\n");
  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([csv], { type: "text/csv;charset=utf-8" })); a.download = "ton-kho-nvl.csv"; a.click();
}
document.addEventListener("keydown", e => { if (e.key === "/" && !/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) { e.preventDefault(); $("q").focus(); } });
const slotN = li => li.some(i => i.pos === "M") ? 3 : li.some(i => i.pos !== "F") ? 2 : 1;
function segIdx(r, pos, n) { if (n === 1) return 0; const nth = r.face === -1; if (n === 2) return (pos === "L") === nth ? 0 : 1; return pos === "M" ? 1 : ((pos === "L") === nth ? 0 : 2); }
function rebuild() {
  RACKS.forEach(r => { while (r.content.children.length) r.content.remove(r.content.children[0]); });
  arrows.length = 0; const seen = {};
  items.forEach(it => {
    const r = R[it.rack], h = hitMap[key(it.rack, it.bay, it.tier)]; if (!r || !h) return;
    const k = key(it.rack, it.bay, it.tier), N = slotN(slotItems(it.rack, it.bay, it.tier)), full = r.L / r.bays - 0.16;
    const L = N > 1 ? full / N - 0.05 : full, off = N > 1 ? -full / 2 + (segIdx(r, it.pos, N) + 0.5) * full / N : 0;
    if (N > 1) seen[k] = N;
    const n = Math.max(1, Math.floor(L / 0.06)), m = new THREE.InstancedMesh(reelGeo, hl.has(it.id) ? hotMat : matFor(it.code), n);
    for (let i = 0; i < n; i++) {
      dum.rotation.set(Math.PI / 2, 0, 0); dum.position.set(h.position.x, h.position.y, h.position.z + off - L / 2 + (i + 0.5) * L / n);
      dum.updateMatrix(); m.setMatrixAt(i, dum.matrix);
    }
    r.content.add(m);
    if (hl.has(it.id) && arrows.length < 20) addArrow(r, h.position.x, h.position.y, h.position.z + off);
  });
  Object.keys(seen).forEach(k => {
    const h = hitMap[k], r = R[k.split("|")[0]], full = r.L / r.bays - 0.16, N = seen[k];
    for (let j = 1; j < N; j++) box(h.geometry.parameters.width, TH - 0.08, 0.06, 0x0f172a, h.position.x, h.position.y, h.position.z - full / 2 + j * full / N, 1, r.content);
  });
  updateHits(); updateLabels();
}

/* ===== chọn ô ===== */
function fillBay() {
  const r = R[$("fRack").value]; if (!r) return;
  $("fBay").innerHTML = Array.from({ length: r.bays }, (_, i) => `<option>${i + 1}</option>`).join("");
  $("fTier").innerHTML = Array.from({ length: r.tiers }, (_, i) => `<option>${i + 1}</option>`).join("");
}
function selectSlot(r, b, t, doFly) {
  sel = { r, b, t };
  $("fRack").value = r; fillBay(); $("fBay").value = b; $("fTier").value = t;
  if (outline && outline.parent) outline.parent.remove(outline);
  const h = hitMap[key(r, b, t)];
  outline = new THREE.LineSegments(new THREE.EdgesGeometry(h.geometry), new THREE.LineBasicMaterial({ color: 0x22d3ee }));
  outline.position.copy(h.position); h.parent.add(outline);
  showCard(); updateLabels();
  if (doFly) {
    const p = h.getWorldPosition(new THREE.Vector3()), d = new THREE.Vector3(R[r].face * 5, 2, 0.5).applyQuaternion(R[r].g.quaternion);
    fly = { t: 0, fp: camera.position.clone(), ft: controls.target.clone(), tp: p.clone().add(d), tt: p };
  }
}
function rackChanged() { fillBay(); $("fBay").value = 1; $("fTier").value = 1; formSel(); }
function formSel() { selectSlot($("fRack").value, +$("fBay").value, +$("fTier").value, false); }
function slotItems(r, b, t) { return items.filter(i => i.rack === r && i.bay === b && i.tier === t); }
function showCard() {
  if (!sel) return;
  const list = slotItems(sel.r, sel.b, sel.t);
  $("slotCard").innerHTML = list.length ? list.map(i => `<div class="it"><span><b>${esc(i.code)}</b> <small>${POSN[i.pos]}${i.name ? " · " + esc(i.name) : ""}</small></span><button data-del="${i.id}">✕</button></div>`).join("") : "<small>Ô trống</small>";
}
$("slotCard").onclick = e => { const id = e.target.dataset.del; if (id) { items = items.filter(i => i.id !== id); commit(); } };

/* ===== dữ liệu ===== */
function save() { try { localStorage.setItem(KEY, JSON.stringify(items)); } catch (e) {} }
function commit() { save(); doSearch(); rebuild(); showCard(); }
function place(o) {
  const r = R[o.rack]; if (!r || o.bay < 1 || o.bay > r.bays || o.tier < 1 || o.tier > r.tiers || !o.code) return false;
  items = items.filter(i => !(i.rack === o.rack && i.bay === o.bay && i.tier === o.tier && (o.pos === "F" || i.pos === "F" || i.pos === o.pos)));
  items.push({ id: uid(), code: o.code, name: o.name || "", rack: o.rack, bay: o.bay, tier: o.tier, pos: o.pos }); return true;
}
function assign() {
  const code = $("fCode").value.trim(), pos = document.querySelector("input[name=pos]:checked").value;
  if (!code) { $("msg").textContent = "Hãy nhập mã NVL."; return; }
  place({ code, name: $("fName").value.trim(), rack: sel.r, bay: sel.b, tier: sel.t, pos });
  $("msg").textContent = `Đã gán ${code} vào ${sel.r} / khoang ${sel.b} / tầng ${sel.t} (${POSN[pos]}).`;
  $("fCode").value = ""; $("fName").value = ""; commit();
}
function bulkImport() {
  let ok = 0, bad = [];
  $("bulk").value.split(/\r?\n/).forEach((ln, n) => {
    if (!ln.trim()) return;
    const c = ln.split(/\t|,|;/).map(s => s.trim()), p = (c[4] || "").toLowerCase();
    const pos = /trái|trai|^l$/.test(p) ? "L" : /phải|phai|^r$/.test(p) ? "R" : /giữa|giua|^m$/.test(p) ? "M" : "F";
    if (place({ code: c[0], rack: (c[1] || "").toUpperCase(), bay: +c[2], tier: +c[3], pos, name: c[5] })) ok++; else bad.push(n + 1);
  });
  $("msg").textContent = `Nhập được ${ok} dòng.` + (bad.length ? ` Lỗi ở dòng: ${bad.join(", ")}.` : "");
  commit();
}
function exportJson() {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([JSON.stringify({ items, layout: layoutData() }, null, 1)], { type: "application/json" }));
  a.download = "data.json"; a.click();
}
function importFile(inp) {
  const f = inp.files[0]; if (!f) return;
  const rd = new FileReader();
  rd.onload = () => { try { const d = JSON.parse(rd.result), a = Array.isArray(d) ? d : d.items; if (!Array.isArray(a)) throw 0; items = a.map(i => ({ ...i, id: uid() })); if (d.layout && d.layout.length) { setLayout(d.layout); saveLayout(); } commit(); $("msg").textContent = "Đã mở " + a.length + " mục."; } catch (e) { $("msg").textContent = "File JSON không hợp lệ."; } };
  rd.readAsText(f); inp.value = "";
}
function clearAll() {
  if (!confirm("Xóa toàn bộ NVL đã gán trên máy này?")) return;
  items = []; try { localStorage.removeItem(KEY); } catch (e) {} doSearch(); rebuild(); showCard();
}

/* ===== tra cứu ===== */
function doSearch() {
  const q = $("q").value.trim().toLowerCase();
  const list = q ? items.filter(i => (i.code + " " + i.name + " " + i.rack).toLowerCase().includes(q)) : items;
  hl = q ? new Set(list.map(i => i.id)) : new Set();
  const g = {}; list.forEach(i => (g[i.code] = g[i.code] || []).push(i));
  $("list").innerHTML = Object.keys(g).sort().map(c => { const a = g[c]; return `<div class="row" data-id="${a[0].id}"><div class="rt"><b>${esc(c)}</b>${a.length > 1 ? `<span class="chip">${a.length} vị trí</span>` : ""}</div>${a[0].name ? `<div class="nm">${esc(a[0].name)}</div>` : ""}<div class="loc">${a.map(i => `<span data-id="${i.id}">${i.rack} · K${i.bay} · T${i.tier}${i.pos !== "F" ? " · " + POSN[i.pos] : ""}</span>`).join("")}</div></div>`; }).join("")
    || `<div class="empty">${q ? "Không tìm thấy NVL nào." : "Chưa có NVL. Bấm vào một ô trên kệ hoặc dùng ✨ Gợi ý ô trống."}</div>`;
  updateStats(); rebuild();
}
function goItem(id, narrow) { const i = items.find(x => x.id === id); if (!i) return; if (narrow || !hl.size) { hl = new Set([id]); rebuild(); } selectSlot(i.rack, i.bay, i.tier, true); }
function goFirst() { const e = document.querySelector("#list .row"); if (e) goItem(e.dataset.id, false); }
$("list").onclick = e => {
  const sp = e.target.closest("span[data-id]"), r = e.target.closest(".row");
  if (sp) goItem(sp.dataset.id, true);
  else if (r) { const it = items.find(x => x.id === r.dataset.id); if (it) { hl = new Set(items.filter(x => x.code === it.code).map(x => x.id)); rebuild(); selectSlot(it.rack, it.bay, it.tier, true); } }
};
function goHome() { fly = { t: 0, fp: camera.position.clone(), ft: controls.target.clone(), tp: HOME.pos.clone(), tt: HOME.tgt.clone() }; }
function toggleSpin() { controls.autoRotate = !controls.autoRotate; controls.autoRotateSpeed = 1.5; $("bSpin").classList.toggle("on", controls.autoRotate); }

/* ===== chuột ===== */
const ray = new THREE.Raycaster(), mouse = new THREE.Vector2(), plane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0), pt = new THREE.Vector3();
let down = null, busy = false, moveMode = false, drag = null;
function setRay(e) { const b = renderer.domElement.getBoundingClientRect(); mouse.set(((e.clientX - b.left) / b.width) * 2 - 1, -((e.clientY - b.top) / b.height) * 2 + 1); ray.setFromCamera(mouse, camera); }
function pickHit(e) { setRay(e); return ray.intersectObjects(hits)[0]; }
function pick(e) { const h = pickHit(e); return h && h.object.userData; }
function floorPt(e) { setRay(e); return ray.ray.intersectPlane(plane, pt) ? pt.clone() : null; }
function toggleMove() { moveMode = !moveMode; $("bMove").classList.toggle("on", moveMode); $("moveBar").style.display = moveMode ? "flex" : "none"; renderer.domElement.style.cursor = moveMode ? "move" : ""; }
renderer.domElement.addEventListener("pointerdown", e => {
  down = { x: e.clientX, y: e.clientY };
  if (!moveMode) return; const u = pick(e), p = u && floorPt(e); if (!p) return;
  const m = grpOf(R[u.r]); drag = { p0: p, m, st: m.map(x => x.g.position.clone()) }; controls.enabled = false; selectSlot(u.r, u.b, u.t, false);
}, true);
window.addEventListener("pointermove", e => {
  if (!drag) return; const p = floorPt(e); if (!p) return;
  drag.m.forEach((x, i) => x.g.position.set(drag.st[i].x + p.x - drag.p0.x, drag.st[i].y, drag.st[i].z + p.z - drag.p0.z));
});
window.addEventListener("pointerup", () => { if (drag) { drag = null; controls.enabled = true; saveLayout(); } });
renderer.domElement.addEventListener("pointerup", e => {
  if (!down || Math.hypot(e.clientX - down.x, e.clientY - down.y) > 5) return;
  const u = pick(e); if (u) selectSlot(u.r, u.b, u.t, false);
});
renderer.domElement.addEventListener("pointermove", e => {
  if (e.buttons || busy) return; busy = true;
  requestAnimationFrame(() => {
    busy = false; const h = pickHit(e), tip = $("tip");
    if (!h) { tip.style.display = "none"; return; }
    const u = h.object.userData, r = R[u.r], rel = h.object.worldToLocal(h.point.clone()).z, li = slotItems(u.r, u.b, u.t), N = slotN(li), len = r.L / r.bays;
    const idx = Math.max(0, Math.min(N - 1, Math.floor((rel + len / 2) / len * N)));
    const it = li.find(i => i.pos === "F" || segIdx(r, i.pos, N) === idx);
    tip.innerHTML = `<small>${u.r} · Khoang ${u.b} · Tầng ${u.t}</small><br>` + (it ? `<b style="color:#f59e0b;font-size:1rem">${esc(it.code)}</b>${it.name ? "<br>" + esc(it.name) : ""}` : "<small>Trống</small>");
    const b = view.getBoundingClientRect(); tip.style.left = e.clientX - b.left + 14 + "px"; tip.style.top = e.clientY - b.top + 14 + "px"; tip.style.display = "block";
  });
});
function resize() { const w = view.clientWidth, h = view.clientHeight; renderer.setSize(w, h); camera.aspect = w / h; camera.updateProjectionMatrix(); }
new ResizeObserver(resize).observe(view);
function animate(t) {
  requestAnimationFrame(animate);
  if (fly) {
    fly.t = Math.min(1, fly.t + 0.03); const k = 1 - Math.pow(1 - fly.t, 3);
    camera.position.lerpVectors(fly.fp, fly.tp, k); controls.target.lerpVectors(fly.ft, fly.tt, k); if (fly.t >= 1) fly = null;
  }
  hotMat.emissiveIntensity = 0.6 + 0.4 * Math.sin(t / 250);
  arrows.forEach(a => a.position.y = a.userData.base + Math.sin(t / 200) * 0.15);
  controls.update(); renderer.render(scene, camera);
}

/* ===== khởi động ===== */
async function init() {
  buildStatic();
  let ok = false, lay = null;
  try { const s = localStorage.getItem(KEY); if (s) { const a = JSON.parse(s); if (Array.isArray(a)) { items = a; ok = true; } } } catch (e) {}
  try { lay = JSON.parse(localStorage.getItem(KEY3)); } catch (e) {}
  if (!ok || !Array.isArray(lay)) try {
    const r = await fetch("data.json", { cache: "no-store" });
    if (r.ok) {
      const d = await r.json(), a = Array.isArray(d) ? d : d.items;
      if (!ok && Array.isArray(a)) { items = a.map(i => ({ ...i, id: i.id || uid() })); ok = true; }
      if (!Array.isArray(lay) && d && Array.isArray(d.layout)) lay = d.layout;
    }
  } catch (e) {}
  if (!ok) items = SAMPLE.map(i => ({ ...i, id: uid() }));
  controls.target.copy(HOME.tgt);
  setLayout(lay); doSearch(); resize(); requestAnimationFrame(animate);
}
init();
</script>
